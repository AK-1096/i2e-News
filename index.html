<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALerts</title>
  <link rel="stylesheet" href="assets/styles.css?v=5">
</head>
<body class="frontpage--gate">

  <header class="masthead">
    <nav class="masthead__inner" aria-label="Primary">
      <span class="masthead__spacer" aria-hidden="true"></span>
      <a class="wordmark" href="index.html" aria-label="ALerts — home">AI<span class="wordmark__foot" aria-hidden="true"></span>ERTS</a>
      <span class="masthead__nav">
        <a class="ghost-link" href="events.html">News &rarr;</a>
        <a class="ghost-link" href="playbook.html">i2e AI Guide &rarr;</a>
        <a class="ghost-link" href="archive.html">Archive &rarr;</a>
        <a class="ghost-link" href="https://forms.cloud.microsoft/r/n6nSsQRXmd" target="_blank" rel="noopener noreferrer">Submit Article &rarr;</a>
      </span>
    </nav>
  </header>

  <!-- The gate: pick a side. Each pill is a plain link to that side's page. -->
  <div class="gate" id="gate">
    <div class="gate__dots" aria-hidden="true"></div>
    <div class="gate__dots gate__dots--focus" aria-hidden="true"></div>

    <div class="gate__inner">
      <p class="gate__kicker caption">Select a view to explore</p>
      <div class="gate__choices">
        <a class="gate__pill gate__pill--ink" href="events.html">News</a>
        <span class="gate__dot" aria-hidden="true">&middot;</span>
        <a class="gate__pill gate__pill--lime" href="playbook.html">i2e AI Guide</a>
      </div>
      <p class="frontpage__note">
        Curated by i2e Consulting AI Labs — summaries by the ALerts curator agent.
      </p>
    </div>
  </div>

  <script>
    // Cursor-tracked dot magnifier. Pointer-driven decoration only, so it is
    // skipped on touch and for readers who ask for reduced motion.
    (function () {
      var gate = document.getElementById('gate');
      if (!gate) return;
      var fine = window.matchMedia('(hover: hover) and (pointer: fine)');
      var stillness = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!fine.matches || stillness.matches) return;
      gate.addEventListener('pointermove', function (e) {
        gate.style.setProperty('--gate-x', e.clientX + 'px');
        gate.style.setProperty('--gate-y', e.clientY + 'px');
        gate.classList.add('is-tracking');
      });
      gate.addEventListener('pointerleave', function () {
        gate.classList.remove('is-tracking');
      });
    })();
  </script>
</body>
</html>
