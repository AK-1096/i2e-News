<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive — ALerts</title>
  <link rel="stylesheet" href="assets/styles.css?v=6">
  <script src="assets/nav.js?v=2"></script>
</head>
<body>
  <header class="masthead">
    <nav class="masthead__inner" aria-label="Primary">
      <span class="masthead__spacer" aria-hidden="true"></span>
      <a class="wordmark" href="index.html" aria-label="ALerts — home">AI<span class="wordmark__foot" aria-hidden="true"></span>ERTS</a>
      <span class="masthead__nav">
        <a class="ghost-link" href="events.html">News &rarr;</a>
        <a class="ghost-link" href="playbook.html">i2e AI Guide &rarr;</a>
        <a class="ghost-link" href="archive.html" aria-current="page">Archive &rarr;</a>
        <a class="ghost-link" href="https://forms.cloud.microsoft/r/n6nSsQRXmd" target="_blank" rel="noopener noreferrer">Submit Article &rarr;</a>
      </span>
    </nav>
  </header>

  <main class="frontpage">
    <section class="hero">
      <h1 class="hero__display">Archive</h1>
      <p class="caption" id="dateline">News and i2e AI Guide entries filed more than 30 days ago</p>
    </section>

    <div id="list">
      <p class="state-loading">Setting the page&hellip;</p>
    </div>

    <footer class="frontpage__footer">
      <a class="pill" href="index.html">Back to latest &rarr;</a>
      <p class="frontpage__note">
        Curated by i2e Consulting AI Labs — summaries by the ALerts curator agent.
      </p>
    </footer>
  </main>

  <script src="assets/app.js?v=12"></script>
  <script>
    // The archive merges News and i2e AI Guide entries into one list and only
    // carries items 30+ days old (see loadArchive()/isArchived() in app.js).
    // It has two screens, both driven by location.hash and both painted into
    // #list:
    //
    //   - Picker (no hash, or a hash matching no month) — a year-grouped grid
    //     of month tiles, one per calendar month present in the archive
    //     (monthsFrom() in app.js). Opening a tile sets the hash.
    //   - Month record (hash "#YYYY-MM" matching a real month) — that month's
    //     header and count, a role filter, its rows (renderArchiveItem(),
    //     already newest-first), and prev/next pills to neighbouring months.
    //
    // Selection lives entirely in the hash, so the back/forward buttons move
    // between the two screens for free; hashMonthKey() is the one place that
    // parses it.
    var list = document.getElementById('list');
    var ARCHIVE_ITEMS = null;      // set once loadArchive() resolves
    var scrollOnHashClick = false; // set by the click listener below

    // The hash as a month key, or null when it's empty/unparseable — covers
    // both "#" and a stray hash typed by hand. Strict so "#2026-8" (no
    // leading zero) falls through to the picker rather than half-matching.
    function hashMonthKey() {
      var h = window.location.hash || '';
      return /^#\d{4}-\d{2}$/.test(h) ? h.slice(1) : null;
    }

    // "6 items &middot; 4 News &middot; 2 AI Guide" — shared by a tile's count
    // line and a month record's header line. Numbers only, so no escaping.
    function monthCountLine(m) {
      return m.total + ' item' + (m.total === 1 ? '' : 's') +
        ' &middot; ' + m.articles + ' News &middot; ' + m.usecases + ' AI Guide';
    }

    // One tile in the picker grid.
    function renderMonthTile(m) {
      var name = m.label.split(' ')[0]; // "August 2026" -> "August"
      var teaser = m.newest ? m.newest.title : '';
      return '<a class="month-tile" href="#' + escapeHtml(m.key) + '">' +
        '<span class="month-tile__name">' + escapeHtml(name) + '</span>' +
        '<span class="month-tile__count caption">' + monthCountLine(m) + '</span>' +
        '<span class="month-tile__teaser">' + escapeHtml(teaser) + '</span>' +
      '</a>';
    }

    // The picker: every month, newest year first, tiled under a year label.
    // `months` is monthsFrom(ARCHIVE_ITEMS) — newest-first — so a run of equal
    // years is always consecutive and each year is emitted as one grid.
    function renderPicker(months) {
      var html = '';
      var i = 0;
      while (i < months.length) {
        var year = months[i].year;
        html += '<h2 class="caption month-header">' + year + '</h2><div class="month-grid">';
        while (i < months.length && months[i].year === year) {
          html += renderMonthTile(months[i]);
          i++;
        }
        html += '</div>';
      }
      list.innerHTML = html;
    }

    // The rows (or the role-filter empty state) for one month. Split out so a
    // role change can repaint just this part without rebuilding the header,
    // which always reflects the whole month regardless of role.
    function renderMonthRows(key, items, role) {
      var monthItems = items.filter(function (it) { return monthKey(it.addedDate) === key; });
      var filtered = filterByRole(monthItems, role);
      if (filtered.length === 0) {
        return '<h2 class="state-card__title">Nothing filed for this role in ' + escapeHtml(monthLabel(key)) + '.</h2>' +
          '<p class="state-card__body">Try another role, or pick &ldquo;Everyone&rdquo; to see the whole month.</p>';
      }
      var rowsHtml = '';
      for (var i = 0; i < filtered.length; i++) rowsHtml += renderArchiveItem(filtered[i]);
      return '<div class="contents">' + rowsHtml + '</div>';
    }

    // The month record: header + role filter + rows + prev/next. `months` is
    // the full monthsFrom(ARCHIVE_ITEMS), so prev/next can find real
    // neighbouring months instead of assuming one exists.
    function renderMonthRecord(key, items, months) {
      var idx = -1;
      for (var i = 0; i < months.length; i++) {
        if (months[i].key === key) { idx = i; break; }
      }
      var m = months[idx];

      var html = '<p><a class="pill" href="#">&larr; All months</a></p>';
      html += '<p class="caption">Archive</p>';
      html += '<h2 class="section-front__title">' + escapeHtml(m.label) + '</h2>';
      html += '<p class="section-front__sub">' + monthCountLine(m) + '</p>';
      html += '<div id="role-filter"></div>';
      html += '<div id="month-rows"></div>';

      var older = idx + 1 < months.length ? months[idx + 1] : null; // left
      var newer = idx - 1 >= 0 ? months[idx - 1] : null;             // right
      if (older || newer) {
        html += '<nav class="month-nav" aria-label="Neighbouring months">';
        if (older) html += '<a class="pill" href="#' + escapeHtml(older.key) + '">&larr; ' + escapeHtml(older.label) + '</a>';
        if (newer) html += '<a class="pill" href="#' + escapeHtml(newer.key) + '">' + escapeHtml(newer.label) + ' &rarr;</a>';
        html += '</nav>';
      }
      list.innerHTML = html;

      var rowsEl = document.getElementById('month-rows');
      function render(role) {
        rowsEl.innerHTML = renderMonthRows(key, items, role);
        if (typeof initRowCounters === 'function') initRowCounters(rowsEl);
      }
      // A fresh role filter every time, so the selection always starts back
      // at "Everyone" when the month changes.
      renderRoleFilter(document.getElementById('role-filter'), render);
      render(null);
    }

    // Paint whichever screen the current hash calls for. A hash that matches
    // no real month (an old link, a typo) falls back to the picker, same as
    // no hash at all.
    function paint() {
      var months = monthsFrom(ARCHIVE_ITEMS);
      var key = hashMonthKey();
      var found = false;
      for (var i = 0; i < months.length; i++) {
        if (months[i].key === key) { found = true; break; }
      }
      if (found) renderMonthRecord(key, ARCHIVE_ITEMS, months);
      else renderPicker(months);

      // Only follow a click here — the browser already puts the reader where
      // they expect on back/forward, and re-scrolling would fight it.
      if (scrollOnHashClick) {
        scrollOnHashClick = false;
        if (list.scrollIntoView) list.scrollIntoView({ block: 'start' });
      }
    }

    loadArchive()
      .then(function (items) {
        var dateline = document.getElementById('dateline');

        if (items.length === 0) {
          list.innerHTML =
            '<h2 class="state-card__title">Nothing has reached the archive yet.</h2>' +
            '<p class="state-card__body">Items move here 30 days after the curator files them. Until then, find them under News and the i2e AI Guide.</p>';
          return;
        }

        if (dateline) {
          dateline.innerHTML =
            'News and i2e AI Guide entries filed more than 30 days ago &middot; ' + items.length + ' items';
        }

        ARCHIVE_ITEMS = items;

        // A click on any in-page hash link (a month tile, "All months", a
        // prev/next pill) is a navigation the reader chose; a hashchange
        // fired without one of these — back/forward — leaves the flag unset.
        list.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
          if (a) scrollOnHashClick = true;
        });

        window.addEventListener('hashchange', paint);
        paint();
      })
      .catch(function (err) {
        list.innerHTML =
          '<div class="card">' +
            '<h2 class="state-card__title">The record couldn&rsquo;t be loaded.</h2>' +
            '<p class="state-card__body">Could not load the archive: ' + escapeHtml(err.message) + '. Try again in a moment.</p>' +
            '<a class="ghost-link" href="index.html">Back to latest &rarr;</a>' +
          '</div>';
      });

    // Dynamic header: retract the masthead on scroll-down, pin the compact
    // "Archive" bar top-left, restore the masthead on scroll-up.
    initDynamicHeader({
      title: 'Archive',
      sub: 'News and i2e AI Guide entries filed more than 30 days ago',
      collapseAfter: document.querySelector('.hero')
    });
  </script>
</body>
</html>
