name: Publish article

# The curator agent (Copilot Studio) publishes by sending a repository_dispatch event with the
# contract fields in client_payload. Two event types share this workflow:
#   - publish-article → data/articles.json (news path, unchanged)
#   - publish-usecase → data/usecases.json (AI Playbook path)
# Each branch upserts, validates against its schema (NFR-3 / FR-U8) BEFORE commit, then commits and
# pushes. The push triggers GitHub Pages' built-in "Deploy from a branch" builder, which does the
# actual deploy — so we intentionally do NOT deploy here (that raced with the branch builder and
# caused "Deployment failed, try again later"). Publishing needs no expression-heavy agent-side logic.

on:
  repository_dispatch:
    types: [publish-article, publish-usecase]

permissions:
  contents: write

# Serialise ALL publish runs (news + playbook): two dispatches close together would otherwise both
# commit off the same base and the second push would fail non-fast-forward. One shared lane covers
# both event types because both push to main. Queue them (never cancel a pending publish).
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # A repository_dispatch checks out GITHUB_SHA = the default-branch tip *at dispatch-creation
        # time*. When several publishes fire close together they share that base, so a queued run
        # (serialised by `concurrency` below) would still commit on the STALE base and its push would
        # be rejected non-fast-forward — silently dropping that article (the agent already got 204).
        # `ref: main` makes the serialised run check out the LIVE branch tip (incl. the prior run's
        # commit) instead, so its push fast-forwards cleanly.
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The agent reports success on HTTP 204, which only means the dispatch was accepted — so when a
      # publish silently fails to land, this log is the only record of what the model actually sent.
      # Printing the top-level key list first makes two recurring faults obvious at a glance: the ten
      # top-level property cap, and a group arriving under the wrong key or with the wrong inner keys.
      # Passed through env (never ${{ }} inside run:) — the payload is model-generated from
      # third-party pages and this job holds contents: write.
      - name: Log the dispatch payload
        env:
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          echo "event_type: ${{ github.event.action }}"
          node -e '
            const p = JSON.parse(process.env.PAYLOAD || "{}");
            const keys = Object.keys(p);
            console.log(`top-level keys (${keys.length}/10 allowed): ${keys.join(", ")}`);
            for (const [k, v] of Object.entries(p)) {
              if (v && typeof v === "object" && !Array.isArray(v)) {
                console.log(`  ${k} -> object keys: ${Object.keys(v).join(", ")}`);
              }
            }
            console.log(JSON.stringify(p, null, 2));
          '

      # --- News path (publish-article) -------------------------------------
      - name: Upsert article into the data contract
        if: github.event.action == 'publish-article'
        env:
          PUBLISH_TARGET: article
          ART_ID: ${{ github.event.client_payload.id }}
          ART_TITLE: ${{ github.event.client_payload.title }}
          ART_URL: ${{ github.event.client_payload.url }}
          ART_SOURCE: ${{ github.event.client_payload.source }}
          ART_SUMMARY: ${{ github.event.client_payload.summary }}
          ART_TOPIC: ${{ github.event.client_payload.topic }}
          ART_PUBLISHED: ${{ github.event.client_payload.publishedDate }}
          ART_ADDED: ${{ github.event.client_payload.addedDate }}
          # Optional reader-facing fields. audience is an array, relevance a nested object — pass
          # both as JSON (toJSON) so the upsert script can parse them; absent → literal "null".
          ART_AUDIENCE: ${{ toJSON(github.event.client_payload.audience) }}
          ART_RELEVANCE: ${{ toJSON(github.event.client_payload.relevance) }}
        run: node scripts/upsert-article.mjs

      # Same gate as pages.yml: a bad write fails here, before commit/deploy, so the live
      # archive is never corrupted (NFR-3).
      - name: Validate articles.json against schema
        if: github.event.action == 'publish-article'
        run: npx --yes ajv-cli@5 validate -s data/articles.schema.json -d data/articles.json

      # --- Playbook path (publish-usecase) ---------------------------------
      # ⚠️ GitHub caps `client_payload` at TEN top-level properties; an 11th makes the dispatch fail
      # with 422 "Invalid request." before any run starts. The use-case contract has 14 fields, so its
      # long-form and provenance fields travel as two nested objects (`content`, `source`), keeping
      # the payload at 9 top-level keys. Both are passed whole via toJSON and destructured in
      # upsert-article.mjs, which also still accepts the flat UC_* form. (Found 12 Aug 2026: the
      # agent 422'd while a hand-built 10-key connector test returned 204 — the count was the only
      # difference. The news path sends 9 keys, which is why it was never affected.)
      - name: Upsert use-case into the data contract
        if: github.event.action == 'publish-usecase'
        env:
          PUBLISH_TARGET: usecase
          UC_ID: ${{ github.event.client_payload.id }}
          UC_TITLE: ${{ github.event.client_payload.title }}
          UC_TOOLS: ${{ toJSON(github.event.client_payload.tools) }}
          UC_CATEGORY: ${{ github.event.client_payload.category }}
          # Grouped: content = {whatItDoes, whatItImproves, howToTry}
          #          origin  = {url, platform, author, publishedDate}
          # ⚠️ The group is named `origin`, NOT `source`: the news branch above reads
          # `client_payload.source` as a STRING, and GitHub evaluates a step's `env:` block even when
          # its `if:` skips the step — so an object under that key fails the whole run at template
          # evaluation with "A mapping was not expected" (hit 12 Aug 2026).
          UC_CONTENT: ${{ toJSON(github.event.client_payload.content) }}
          UC_ORIGIN: ${{ toJSON(github.event.client_payload.origin) }}
          UC_DIFFICULTY: ${{ github.event.client_payload.difficulty }}
          UC_CURATOR_VERIFIED: ${{ github.event.client_payload.curatorVerified }}
          UC_ADDED: ${{ github.event.client_payload.addedDate }}
          # Same optional reader-facing fields as the news path (see above).
          UC_AUDIENCE: ${{ toJSON(github.event.client_payload.audience) }}
          UC_RELEVANCE: ${{ toJSON(github.event.client_payload.relevance) }}
        run: node scripts/upsert-article.mjs

      - name: Validate usecases.json against schema
        if: github.event.action == 'publish-usecase'
        run: npx --yes ajv-cli@5 validate -s data/usecases.schema.json -d data/usecases.json

      # --- Shared commit ---------------------------------------------------
      - name: Commit the updated data contract
        # The title is model-generated from third-party pages, so it must never be expanded into the
        # shell by ${{ }} — a title containing a double quote breaks out of the -m argument (seen
        # 28 Jul 2026: `"anyone with a link"` split into stray pathspecs and failed the commit AFTER
        # a successful upsert + validate), and a crafted one would be command execution in a job with
        # `contents: write`. Pass it through the environment instead; the shell only ever sees "$VAR".
        env:
          COMMIT_TITLE: ${{ github.event.client_payload.title }}
        run: |
          git config user.name "newspulse-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/usecases.json
          if git diff --cached --quiet; then
            echo "No change to the data contract (idempotent republish); skipping commit."
          else
            git commit -m "Publish: $COMMIT_TITLE"
            git push
          fi
      # No deploy step: the push above triggers the GitHub Pages branch builder, which deploys.
